<style>

.field{margin-bottom:18px}.field>label{margin-bottom:6px}.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}

  .big-q{font-size:19px;line-height:1.45;margin:12px 0 16px}
  .trh .lbl{display:none}
  .trh{justify-content:flex-end}
  #cols>summary{cursor:pointer;font-weight:700;padding:8px 0;font-size:15px}
  .nav{margin-top:12px}
  .navb{padding:10px 12px;font-size:15px}
  .cal{gap:4px;margin:8px 0}
  .day{min-height:36px}
  .btns button, button{min-height:42px;padding:9px 12px;font-size:14px}
  .choice{padding:12px;font-size:15px;min-height:46px}
  input[type=text],input[type=password],input[type=number],select,textarea{font-size:16px;padding:10px}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .katex-display{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:4px 0}
}
@media(max-width:480px){
  main{padding:16px 12px 80px}
  body.focus main{padding:16px 12px 80px}
  .btns button{flex:1 1 auto;text-align:center;justify-content:center}
  .day{min-height:34px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

function loadDemo(){
  const t = dateStr(0);
  const existingCols = new Set(S.collections.map(c=>c.id));
  DEMO_COLLECTIONS.forEach(c => {
    if (!existingCols.has(c.id)) S.collections.push(Object.assign({}, c));
  });
  const existingProbs = new Set(S.problems.map(p=>p.id));
  DEMO_PROBLEMS.forEach(p => {
    if (!existingProbs.has(p.id)) {
      const d = p.due === 'today' ? t : p.due === 'tomorrow' ? addDays(t, 1) : dateStr(0);
      const s = p.seen === 'yesterday' ? addDays(t, -1) : null;
      S.problems.push(Object.assign({}, p, { due: d, seen: s }));
    }
  });
  save();
  ui.scope = null;
  ui.view = 'cal';
  ui.warn = '';
  render();
}

async function callBrowserAI(prompt, sig) {
  let session = null;
  if (typeof ai !== 'undefined' && ai.languageModel) {
    const caps = await ai.languageModel.capabilities().catch(()=>null);
    if (caps && caps.available !== 'no') {
      session = await ai.languageModel.create().catch(()=>null);
    }
  } else if (typeof window !== 'undefined' && window.ai && window.ai.languageModel) {
    const caps = await window.ai.languageModel.capabilities().catch(()=>null);
    if (caps && caps.available !== 'no') {
      session = await window.ai.languageModel.create().catch(()=>null);
    }
  } else if (typeof window !== 'undefined' && window.ai && window.ai.assistant) {
    const caps = await window.ai.assistant.capabilities().catch(()=>null);
    if (caps && caps.available !== 'no') {
      session = await window.ai.assistant.create().catch(()=>null);
    }
  }
  if (!session) return null;
  return await session.prompt(prompt, { signal: sig });
}

async function gem(prompt,images=[],sig,think){
  const key=S.settings.key;
  if(!key){
    if(!images.length){
      try{
        const localRes = await callBrowserAI(prompt, sig);
        if(localRes){
          let out;
          try{ out = JSON.parse(localRes); }catch(e){
            const mt = localRes.replace(/```json|```/gi,'').match(/[{[][\s\S]*[}\\]]/);
            try{ out = mt && JSON.parse(mt[0]); }catch(e2){}
          }
          if(out && typeof out === 'object'){
            ui.model = 'Chrome On-Device AI';
            return out;
          }
        }
      }catch(err){
        console.warn('Browser AI failed:', err);
      }
    }
    throw new Error('Add your Gemini API key in Settings, or use Chrome with Built-in AI to run without a key.');
  }
  const parts=[{text:prompt},...images.map(i=>({inline_data:{mime_type:i.type,data:i.data}}))];
  const models=[...new Set([S.settings.model,'gemini-2.5-flash','gemini-2.5-flash-lite'])].filter(Boolean);
  let last;
  for(const m of models){
    for(let a=0;a<2;a++){
      if(sig&&sig.aborted)throw new Error('Cancelled.');
      const c=new AbortController(),to=setTimeout(()=>c.abort(),60000),ab=()=>c.abort();
      if(sig)sig.addEventListener('abort',ab);
      let again=false,next=false;const gc={temperature:0,responseMimeType:'application/json'};if(think!=null&&/flash/.test(m))gc.thinkingConfig={thinkingBudget:think};
      try{
        const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts}],generationConfig:gc}),signal:c.signal});
        const j=await r.json().catch(()=>({}));
        if(!r.ok){
          const msg=(j.error&&j.error.message)||'Gemini returned status '+r.status+'.';
          if([429,500,503,528].includes(r.status)){last=new Error(m+' is busy ('+r.status+').');again=a===0;next=true}
          else if(r.status===404){last=new Error('Model '+m+' was not found.');next=true}
          else throw Object.assign(new Error(msg),{fatal:true});
        }else{
          const t=((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('');ui.raw=t.slice(0,4000);
          let out;try{out=JSON.parse(t)}catch(e){const mt=t.replace(/```json|```/gi,'').match(/[\{\[][\s\S]*[\}\]]/);try{out=mt&&JSON.parse(mt[0])}catch(e2){}}
          if(out&&typeof out==='object'){ui.model=m;return out}
          last=new Error(m+' did not return valid JSON.');next=true;
        }
      }catch(e){
        if(e.fatal)throw e;
        if(sig&&sig.aborted)throw new Error('Cancelled.');
        last=e.name==='AbortError'?new Error(m+' timed out.'):e;next=true;
      }finally{clearTimeout(to);if(sig)sig.removeEventListener('abort',ab)}
      if(again){await sleep(1500);continue}
      if(next)break;
    }
  }
  throw new Error('All Gemini models failed. Last error: '+(last&&last.message||'unknown'));
}

function norm(p){
  const lo=x=>String(x).toLowerCase().replace(/\s+/g,' ').trim();
  let A=String(p.answer==null?'':p.answer).trim(),weak=false;
  let ch=(Array.isArray(p.choices)?p.choices:[]).map(String).filter(x=>x.trim()).slice(0,4);
  let ci=[];
  if(Array.isArray(p.correct_indices)){
    ci=p.correct_indices.map(Number).filter(n=>Number.isInteger(n)&&n>=0);
  }else if(Number.isInteger(p.correct_index)&&p.correct_index>=0){
    ci=[p.correct_index];
  }
  const multi=Boolean(p.multi||ci.length>1);

  if(ch.length>=2){
    ci=ci.filter(i=>i<ch.length);
    if(!ci.length){
      const m=A?ch.findIndex(x=>lo(x)===lo(A)):-1;
      if(m>=0)ci=[m];else{ci=[0];weak=true}
    }
  }else{
    const seen=new Set([lo(A)]),wr=[];
    (Array.isArray(p.wrong)?p.wrong:[]).map(String).forEach(x=>{if(x.trim()&&!seen.has(lo(x))){seen.add(lo(x));wr.push(x)}});
    if(wr.length<3||!A)weak=true;
    ch=shuf([A||'?',...wr.slice(0,3)]);
    ci=[ch.indexOf(A||'?')];
  }
  if(ch.length<4)weak=true;
  while(ch.length<4)ch.push('None of the above');
  if(!A)A=ci.map(i=>ch[i]).join(', ');

  return{
    question:String(p.question||'').trim(),
    choices:ch,
    correct_indices:ci,
    correct_index:ci[0]??0,
    multi,
    answer:A,
    solution:String(p.solution||''),
    topic:String(p.topic||'').slice(0,40),
    source:p.source==='key'?'key':p.source==='solved'?'solved':'',
    weak
  };
}

function clean(d){
  if(!d||!Array.isArray(d.collections)||!Array.isArray(d.problems))throw new Error('bad');
  const imgs={};Object.entries(d.images||{}).forEach(([k,v])=>{if(v&&IMGOK.test(v.type)&&typeof v.data==='string'&&B64.test(v.data))imgs[k]=v});

  const cid=new Set(cols.map(c=>c.id));cols.forEach(c=>{if(c.parent&&!cid.has(c.parent))c.parent=null});
  const probs=d.problems.filter(p=>p&&typeof p.id==='string'&&typeof p.question==='string'&&cid.has(p.col)).map(p=>{
    const o=Object.assign(norm(p),{id:p.id,col:p.col,box:Math.min(5,Math.max(1,(p.box|0)||1)),last:p.last==='right'||p.last==='wrong'?p.last:null,seen:DATE.test(p.seen||'')?p.seen:null,due:DATE.test(p.due||'')?p.due:dateStr(0),miss:p.miss|0,att:p.att|0,hit:p.hit|0,susp:!!p.susp});
    o.imgs=(Array.isArray(p.imgs)?p.imgs:[]).filter(k=>imgs[k]);return o});
  return{collections:cols,problems:probs,images:imgs,log:d.log||{}};
}
