<style>
:root{
  --ink:#1d1d1f;--paper:#ffffff;--wash:#f5f5f7;--mute:#86868b;--accent:#0071e3;
  --bad:#ff3b30;--g:#34c759;--border:#d2d2d7;--card-bg:#ffffff;

}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--font-system)}
h1,h2,h3,legend{font-family:var(--font-system);font-weight:600;line-height:1.2;margin:0}
h1{font-size:32px;letter-spacing:-.015em}h2{font-size:22px;margin:24px 0 14px;letter-spacing:-.01em}
.big{font-size:clamp(22px,3.5vw,34px);font-weight:600;letter-spacing:-.02em;margin:24px 0 28px}
.mute{color:var(--mute)}.err{color:var(--bad)}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;background:var(--paper);padding:8px 14px;border-radius:var(--radius-sm);z-index:99;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}

#rail>*{margin-left:18px;margin-right:18px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}

.brand{font:600 18px/1 var(--font-system);letter-spacing:-.02em}
.icons{display:flex;gap:6px}

.icb.plus:hover:not(:disabled){background:#005bb5}
.icb[aria-current=page]:not(.plus){background:var(--ink);color:var(--paper);border-color:var(--ink)}
.nav{display:grid;gap:2px;margin:18px 0 0;padding-top:10px;border-top:1px solid var(--border)}
.navb{border:0;border-radius:var(--radius-sm);text-align:left;padding:8px 12px;font-weight:500;font-size:13px;background:transparent;cursor:pointer;transition:var(--ease)}
.navb:hover{background:rgba(0,0,0,.04)}
.navb[aria-current=page]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
.when{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--mute)}#dd{font-weight:600;color:var(--ink)}
#side{margin-top:24px}
.trh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.tree{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--paper)}
.tn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--border);text-align:left;padding:9px 12px;font-size:13px;cursor:pointer;background:var(--paper);transition:var(--ease)}
.tree .tn:last-child{border-bottom:0}.tn.top{font-weight:600;background:var(--wash)}
.tn[aria-pressed=true]{background:var(--accent);color:#fff}
.tl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kd{font-size:11px;font-weight:400;margin-left:6px;opacity:.75}
.pill{min-width:20px;text-align:center;padding:1px 6px;border-radius:10px;font-size:11px;font-weight:600;background:var(--wash);color:var(--ink)}
.tn[aria-pressed=true] .pill{background:rgba(255,255,255,.2);color:#fff}
#cal{margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.sh{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--mute);margin:0 0 10px}
.chip{border:1px solid var(--border);border-radius:16px;padding:3px 10px;background:var(--paper);display:inline-flex;gap:6px;align-items:center;margin:0 6px 6px 0;font-weight:600;font-size:12px}
#cal .btns{align-items:center}#cal .btns button{padding:4px 8px;font-size:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0}.cal .w{font-weight:600;font-size:11px;text-align:center;color:var(--mute)}
.day{position:relative;aspect-ratio:1;min-height:28px;padding:0;border:1px solid var(--border);border-radius:var(--radius-sm);background:#e5e5ea;overflow:hidden;font-weight:600;cursor:pointer;transition:var(--ease)}
.day:hover:not(:disabled){filter:brightness(.95)}
.day.s1{background:linear-gradient(to top,var(--g) 50%,#e5e5ea 50%)}
.day.s2{background:var(--g);color:#fff;border-color:var(--g)}
.day .n{position:absolute;top:2px;left:4px;font-size:11px}
.day .due{position:absolute;right:2px;bottom:2px;font-size:9px;background:var(--paper);color:var(--ink);border-radius:4px;padding:0 3px;line-height:1.2;font-weight:700}
.day.today{outline:2px solid var(--accent);outline-offset:1px}.day.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.legend{display:flex;align-items:center;gap:6px;font-size:12px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--border);background:#e5e5ea}.sw.s1{background:linear-gradient(to top,var(--g) 50%,#e5e5ea 50%)}.sw.s2{background:var(--g);border-color:var(--g)}
main{padding:36px 48px 120px;max-width:960px;width:100%}
.focusbar{margin-bottom:24px}
body.focus .shell{grid-template-columns:1fr}
body.focus #rail,body.focus #foot,body.focus #cookie{display:none}
body.focus main{max-width:680px;margin:0 auto;padding:40px 20px 120px}
button,select,input,textarea{font:inherit;color:var(--ink);border-radius:var(--radius-sm)}
button{border:1px solid var(--border);background:var(--paper);padding:8px 14px;font-weight:500;cursor:pointer;transition:var(--ease)}
button:hover:not(:disabled){background:var(--wash)}button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

button.link{border:0;background:none;text-decoration:none;padding:4px 6px;color:var(--accent);font-weight:500}button.link:hover:not(:disabled){text-decoration:underline}
:focus-visible{outline:3px solid rgba(0,113,227,.4);outline-offset:2px}

input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(0,113,227,.2)}
textarea{min-height:120px;resize:vertical;font-family:var(--font-mono);font-size:13px}
label{display:block;font-weight:500}
fieldset{border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 18px;margin:0 0 16px;background:var(--wash)}legend{font-size:15px;padding:0 6px}
.opt{display:flex;gap:10px;align-items:center;padding:4px 0;cursor:pointer}
input[type=radio],input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
table{border-collapse:collapse;width:100%;margin:12px 0 28px}th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--border)}th{font-weight:600;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.02em}tr:last-child td{border-bottom:1px solid var(--border)}
kbd,.shortcut{font-family:var(--font-mono);font-size:11px;padding:1px 5px;border:1px solid var(--border);border-radius:4px;background:var(--wash);color:var(--mute);margin-left:6px;white-space:nowrap}
button.primary kbd{border-color:rgba(255,255,255,.4);color:#fff;background:transparent}
.hint{font-size:12px;color:var(--mute);margin-top:8px}
.q{font-size:15px;overflow-x:auto;max-width:75ch}.big-q{font-size:20px;line-height:1.5;margin:16px 0 20px;font-weight:500}
.progwrap{margin-bottom:20px}
.prog{display:flex;gap:4px;height:6px;border-radius:3px;overflow:hidden;background:#e5e5ea}
.prog span{flex:1 1 0;height:100%;transition:var(--ease)}.prog .f{background:var(--ink)}.prog .c{background:var(--accent)}
.plabel{display:block;margin-top:6px;font-size:12px;color:var(--mute);font-weight:500}
.choices{display:grid;gap:8px;margin-bottom:20px}
.choice{position:relative;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 16px;cursor:pointer;font-size:15px;background:var(--paper);transition:var(--ease)}
.choice input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.choice .ckbox{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border);margin-top:2px;display:grid;place-items:center;flex:none;background:#fff;transition:var(--ease)}
.choice.radio .ckbox{border-radius:50%}
.choice:has(input:checked) .ckbox{background:var(--accent);border-color:var(--accent);color:#fff}
.choice:has(input:checked){border-color:var(--accent);background:rgba(0,113,227,.03)}
.choice:not(.locked):hover{background:var(--wash)}
.choice.locked{cursor:default}
.choice.right{border-color:var(--g);background:rgba(52,199,89,.08)}.choice.right .ckbox{background:var(--g);border-color:var(--g);color:#fff}
.choice.wrong{border-color:var(--bad);background:rgba(255,59,48,.08)}.choice.wrong .ckbox{background:var(--bad);border-color:var(--bad);color:#fff}
.tag{margin-left:auto;white-space:nowrap;font-size:12px;font-weight:600}
.row{border-top:1px solid var(--border);padding:16px 0}.row p{margin:6px 0 10px}.row .btns{display:flex;flex-wrap:wrap;gap:8px}
.chk{border-left:3px solid var(--bad);padding-left:14px}
.verdict{margin:24px 0 10px;font-size:24px}.verdict.ok{color:var(--g)}.verdict.no{color:var(--bad)}
.result{border-left:3px solid var(--ink);padding-left:18px;margin:20px 0}
.field{margin-bottom:16px}.field>label{margin-bottom:6px;font-size:13px;color:var(--mute)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.pimg{max-width:100%;max-height:340px;display:block;margin:12px 0;cursor:zoom-in;border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:0 2px 8px rgba(0,0,0,.04);transition:var(--ease)}.pimg.zoom{max-height:none;cursor:zoom-out}
#foot{border-top:1px solid var(--border);padding:24px;margin-top:40px;background:var(--wash);font-size:13px;color:var(--mute)}#foot p{margin:4px 0}
body.ck{padding-bottom:120px}
#cookie{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:14px 24px;display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;z-index:50}#cookie:empty{display:none}#cookie p{margin:0;flex:1 1 360px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:70;display:flex;gap:12px;align-items:center;background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--radius-lg);box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}#toast:empty{display:none}
#toast button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:var(--radius-sm)}#toast button:hover:not(:disabled){background:rgba(255,255,255,.3)}
dialog{border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;max-width:540px;width:calc(100% - 32px);background:var(--paper);color:var(--ink);box-shadow:0 16px 40px rgba(0,0,0,.15)}dialog::backdrop{background:rgba(0,0,0,.4);backdrop-filter:blur(4px)}
@media(min-width:821px){#cols>summary{display:none}}
@media(max-width:820px){.shell{grid-template-columns:1fr}#rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border)}main{padding:24px 16px 80px}.trh .lbl{display:none}.trh{justify-content:flex-end}#cols>summary{cursor:pointer;font-weight:600;padding:6px 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

async function gem(prompt,images=[],sig,think){
  const key=S.settings.key;if(!key)throw new Error('Add your Gemini API key in Settings first.');
  const parts=[{text:prompt},...images.map(i=>({inline_data:{mime_type:i.type,data:i.data}}))];
  const models=[...new Set([S.settings.model,'gemini-2.5-flash','gemini-2.5-flash-lite'])].filter(Boolean);
  let last;
  for(const m of models){
    for(let a=0;a<2;a++){
      if(sig&&sig.aborted)throw new Error('Cancelled.');
      const c=new AbortController(),to=setTimeout(()=>c.abort(),60000),ab=()=>c.abort();
      if(sig)sig.addEventListener('abort',ab);
      let again=false,next=false;const gc={temperature:0,responseMimeType:'application/json'};if(think!=null&&/flash/.test(m))gc.thinkingConfig={thinkingBudget:think};
      try{
        const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(m)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts}],generationConfig:gc}),signal:c.signal});
        const j=await r.json().catch(()=>({}));
        if(!r.ok){
          const msg=(j.error&&j.error.message)||'Status '+r.status;
          if([429,500,503,528].includes(r.status)){last=new Error(m+' is busy ('+r.status+').');again=a===0;next=true}
          else if(r.status===404){last=new Error('Model '+m+' was not found.');next=true}
          else throw Object.assign(new Error(msg),{fatal:true});
        }else{
          const t=((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('');ui.raw=t.slice(0,4000);
          let out;try{out=JSON.parse(t)}catch(e){const mt=t.replace(/```json|```/gi,'').match(/[\{\[][\s\S]*[\}\]]/);try{out=mt&&JSON.parse(mt[0])}catch(e2){}}
          if(out&&typeof out==='object'){ui.model=m;return out}
          last=new Error(m+' did not return valid JSON.');next=true;
        }
      }catch(e){
        if(e.fatal)throw e;
        if(sig&&sig.aborted)throw new Error('Cancelled.');
        last=e.name==='AbortError'?new Error(m+' timed out.'):e;next=true;
      }finally{clearTimeout(to);if(sig)sig.removeEventListener('abort',ab)}
      if(again){await sleep(1500);continue}
      if(next)break;
    }
  }
  throw new Error('All Gemini attempts failed: '+(last&&last.message||'unknown'));
}

function norm(p){
  const lo=x=>String(x).toLowerCase().replace(/\s+/g,' ').trim();
  let A=String(p.answer==null?'':p.answer).trim(),weak=false;
  let ch=(Array.isArray(p.choices)?p.choices:[]).map(String).filter(x=>x.trim());
  let ci=[];
  
  if(Array.isArray(p.correct_indices)){
    ci=p.correct_indices.map(Number).filter(n=>Number.isInteger(n)&&n>=0);
  }else if(Number.isInteger(p.correct_index)&&p.correct_index>=0){
    ci=[p.correct_index];
  }

  const multi=Boolean(p.multi||ci.length>1);

  if(ch.length>=2){
    ci=ci.filter(i=>i<ch.length);
    if(!ci.length){ci=[0];weak=true}
  }else{
    const seen=new Set([lo(A)]),wr=[];
    (Array.isArray(p.wrong)?p.wrong:[]).map(String).forEach(x=>{if(x.trim()&&!seen.has(lo(x))){seen.add(lo(x));wr.push(x)}});
    if(wr.length<3||!A)weak=true;
    ch=shuf([A||'?',...wr.slice(0,3)]);
    ci=[ch.indexOf(A||'?')];
  }
  while(ch.length<4)ch.push('None of the above');
  if(!A)A=ci.map(i=>ch[i]).join(', ');

  return{
    question:String(p.question||'').trim(),
    choices:ch,
    correct_indices:ci,
    correct_index:ci[0]??0,
    multi,
    answer:A,
    solution:String(p.solution||''),
    topic:String(p.topic||'').slice(0,40),
    source:p.source==='key'?'key':p.source==='solved'?'solved':'',
    weak
  };
}

async function addFiles(fs){
  ui.view='add';
  for(const f of [...fs]){
    const n=f.name||'file',ty=f.type||'';
    try{
      if(ty.startsWith('image/'))ui.imgs.push(await b64(f));
      else if(ty==='application/pdf'||/\.pdf$/i.test(n)){ui.busy='Processing PDF...';render();await pdfPages(f)}
      else if(/\.docx$/i.test(n)||ty.includes('wordprocessingml')){ui.busy='Processing Word document...';render();await readDocx(f)}
      else ui.warn='Unsupported file format.';
    }catch(e){ui.warn=n+': '+e.message}
  }
  ui.busy='';render();
}

  if(ui.view!=='study'||!S.sess)return;
  const t=e.target,typing=t.tagName==='TEXTAREA'||t.tagName==='INPUT';
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){const b=$('#chk')||$('#nxt');if(b&&!b.disabled){e.preventDefault();b.click()}return}
  if(typing||e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==='Enter'&&ui.res){const b=$('#nxt');if(b){e.preventDefault();b.click()}return}
  if(/^[1-4]$/.test(e.key)&&ui.cur&&!ui.res){
    const idx=+e.key-1;
    if(ui.cur.multi){
      if(ui.picks.includes(idx))ui.picks=ui.picks.filter(x=>x!==idx);else ui.picks.push(idx);
    }else{
      ui.pick=idx;
    }
    render();
  }
});

load0();ui.today=dateStr(0);
window.addEventListener('DOMContentLoaded',()=>{save();render();setInterval(tick,1000)});
</script>
