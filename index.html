<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'unsafe-inline' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; img-src data: blob:; connect-src https://generativelanguage.googleapis.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Leitner box</title>
<!-- Basic geometric Leitner box SVG favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='28' height='24' fill='none' stroke='%23111' stroke-width='3'/%3E%3Cline x1='2' y1='12' x2='30' y2='12' stroke='%23111' stroke-width='3'/%3E%3Cline x1='10' y1='18' x2='22' y2='18' stroke='%23111' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--ink:#111;--paper:#fff;--wash:#f1f1ee;--mute:#5c5c57;--accent:#1b3dff;--bad:#b3261e;--g:#008a00;--border:#111;--bg:#fff;--ease:all 150ms cubic-bezier(.4,0,.2,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.65 Menlo,"Courier New",monospace;overflow-x:hidden}
h1,h2,h3,legend{font-family:Georgia,"Times New Roman",serif;line-height:1.15;margin:0}
h1{font-size:38px;letter-spacing:-.02em}h2{font-size:26px;margin:24px 0 16px}
.big{font-size:clamp(24px,4vw,38px);font-weight:400;max-width:20em;margin:28px 0 32px}
.mute{color:var(--mute)}.err{color:var(--bad)}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:var(--paper);padding:8px;z-index:9}
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
#rail{border-right:1px solid var(--ink);position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 0 28px}
#rail>*{margin-left:20px;margin-right:20px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font:700 24px Georgia,serif}
.icons{display:flex;gap:6px}
.icb{width:36px;height:36px;padding:0;display:inline-grid;place-items:center}
.icb.plus{background:var(--accent);border-color:var(--accent);color:#fff}
.icb.plus:hover:not(:disabled){background:var(--ink);border-color:var(--ink)}
.icb[aria-current=page]:not(.plus){background:var(--ink);color:var(--paper)}
.nav{display:grid;margin:16px 0 0;border-top:1px solid var(--ink)}
.navb{border:0;border-bottom:1px solid var(--ink);text-align:left;padding:10px 12px;font-size:14px}
.navb[aria-current=page]{background:var(--ink);color:var(--paper)}
.when{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}#dd{font-weight:700}
#side{margin-top:20px}
.trh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.tree{border:1px solid var(--ink)}
.tn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--ink);text-align:left;padding:9px 12px;font-size:13px}
.tree .tn:last-child{border-bottom:0}.tn.top{font-weight:700;background:var(--wash)}
.tn[aria-pressed=true]{background:var(--accent);color:#fff}
.tl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kd{font-size:12px;font-weight:400;margin-left:6px;opacity:.75}
.pill{min-width:24px;text-align:center;padding:0 6px;border:1px solid currentColor;font-size:12px;font-weight:700;background:var(--paper);color:var(--ink)}
#cal{margin-top:24px;padding-top:20px;border-top:1px solid var(--ink)}
.sh{font-size:20px;margin:0 0 6px}.sm{font-size:12px;margin:4px 0}
.chip{border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);padding:3px 8px;background:var(--paper);display:inline-flex;gap:8px;align-items:center;margin:0 6px 6px 0;font-weight:700;font-size:12px}
#cal .btns{align-items:center}#cal .btns button{padding:4px 10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:12px 0}.cal .w{font-weight:700;text-align:center}
.day{position:relative;aspect-ratio:1;min-height:30px;padding:0;border:2px solid var(--ink);background:#d8d8d2;box-shadow:2px 2px 0 var(--ink);overflow:hidden;font-weight:700}
.day:hover:not(:disabled){background:#bdbdb6;color:var(--ink)}
.day.s1{background:linear-gradient(to top,var(--g) 50%,#d8d8d2 50%)}.day.s1:hover:not(:disabled){background:linear-gradient(to top,#006400 50%,#bdbdb6 50%)}
.day.s2{background:var(--g);color:#fff}.day.s2:hover:not(:disabled){background:#006400;color:#fff}
.day .n{position:absolute;top:0;left:3px;font-size:11px}
.day .due{position:absolute;right:1px;bottom:1px;font-size:9px;background:var(--paper);color:var(--ink);border:1px solid var(--ink);padding:0 3px;line-height:1.2}
.day.today{outline:3px solid var(--accent);outline-offset:1px}.day.sel{border-color:var(--accent);transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.legend{display:flex;align-items:center;gap:6px}
.sw{display:inline-block;width:13px;height:13px;border:2px solid var(--ink);background:#d8d8d2}.sw.s1{background:linear-gradient(to top,var(--g) 50%,#d8d8d2 50%)}.sw.s2{background:var(--g)}
main{padding:32px 48px 120px;max-width:960px;width:100%}
.focusbar{margin-bottom:24px}
body.focus .shell{grid-template-columns:1fr}
body.focus #rail,body.focus #foot,body.focus #cookie{display:none}
body.focus main{max-width:680px;margin:0 auto;padding:32px 20px 120px}
button,select,input,textarea{font:inherit;color:var(--ink);border-radius:0}
button{border:1px solid var(--ink);background:var(--paper);padding:9px 14px;cursor:pointer;transition:var(--ease)}
button:hover:not(:disabled){background:var(--ink);color:var(--paper)}button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover:not(:disabled){background:var(--ink);border-color:var(--ink)}
button.ghost{border-color:transparent;text-decoration:underline}
button.link{border:0;background:none;text-decoration:underline;padding:4px 8px;color:var(--accent)}button.link:hover:not(:disabled){background:var(--ink);color:var(--paper)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
input[type=text],input[type=password],input[type=number],select,textarea{width:100%;border:1px solid var(--ink);background:var(--paper);padding:10px;font-size:16px}
textarea{min-height:120px;resize:vertical}label{display:block}
fieldset{border:1px solid var(--ink);padding:14px 18px;margin:0 0 16px}legend{font-size:18px;padding:0 8px}
.opt{display:flex;gap:10px;align-items:center;padding:4px 0;cursor:pointer}
input[type=radio],input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px;margin:0;cursor:pointer}
table{border-collapse:collapse;width:100%;margin:12px 0 28px}th,td{text-align:left;padding:8px 12px;border-top:1px solid var(--ink)}tr:last-child td{border-bottom:1px solid var(--ink)}
kbd,.shortcut{font:inherit;font-size:11px;line-height:1.4;padding:1px 5px;border:1px solid currentColor;background:var(--paper);color:var(--ink);margin-left:8px;white-space:nowrap}
button.primary kbd{background:transparent;color:#fff}button:hover:not(:disabled) kbd{background:transparent;color:inherit}
.hint{font-size:12px;color:var(--mute)}.hint kbd{margin:0 2px;color:var(--ink)}
.q{font-size:16px;overflow-x:auto;max-width:70ch}.big-q{font-family:Georgia,serif;font-size:22px;line-height:1.5;margin:16px 0 20px;max-width:none}
.progwrap{margin-bottom:16px}
.prog{display:flex;gap:2px}.prog span{flex:1 1 0;min-width:2px;height:10px;border:1px solid var(--ink)}.prog .f{background:var(--ink)}.prog .c{background:var(--accent)}
.plabel{display:block;margin-top:6px}
.choices{display:grid;gap:6px;margin-bottom:20px}
.choice{position:relative;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--ink);padding:12px 14px;cursor:pointer;font-size:15px;transition:var(--ease);background:var(--paper)}
.choice input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.choice kbd{margin:2px 0 0;flex:none}.choice .ct{flex:1;min-width:0}
.choice:not(.locked):hover{background:var(--wash)}
.choice:has(input:checked){background:var(--ink);color:var(--paper)}.choice:has(input:checked) kbd{color:var(--ink)}
.choice:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:3px}
.choice.locked{cursor:default}
.choice.right{border:3px solid var(--accent);background:var(--paper);color:var(--ink)}.choice.wrong{border:3px solid var(--bad);background:var(--paper);color:var(--ink)}
.tag{margin-left:auto;white-space:nowrap}
.row{border-top:1px solid var(--ink);padding:16px 0}.row p{margin:6px 0 10px}.row .btns{display:flex;flex-wrap:wrap;gap:8px}
.chk{border-left:4px solid var(--bad);padding-left:12px}.row .opt input[type=text]{flex:1}
.verdict{margin:28px 0 12px}.verdict.ok{color:var(--accent)}.verdict.no{color:var(--bad)}
.result{border-left:3px solid var(--ink);padding-left:20px;margin:20px 0}
.field{margin-bottom:18px}.field>label{margin-bottom:6px}.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.pimg{max-width:100%;max-height:320px;display:block;margin:10px 0;cursor:zoom-in;border:1px solid var(--ink)}.pimg.zoom{max-height:none;cursor:zoom-out}
#foot{border-top:1px solid var(--ink);padding:20px 24px;margin-top:40px}#foot p{margin:4px 0}
body.ck{padding-bottom:120px}
#cookie{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:3px solid var(--ink);padding:14px 24px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;z-index:5}#cookie:empty{display:none}#cookie p{margin:0;flex:1 1 360px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:7;display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;padding:10px 14px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--accent);max-width:calc(100% - 32px)}#toast:empty{display:none}
#toast button{background:transparent;color:#fff;border-color:#fff}#toast button:hover:not(:disabled){background:#fff;color:var(--ink)}
body.ck #toast{bottom:104px}
dialog{border:2px solid var(--ink);padding:20px;max-width:560px;width:calc(100% - 24px);background:var(--paper);color:var(--ink)}dialog::backdrop{background:rgba(0,0,0,.55)}

/* Mobile Optimization */
@media(max-width:820px){
  .shell{grid-template-columns:1fr}
  #rail{position:static;height:auto;border-right:0;border-bottom:2px solid var(--ink);padding:16px 16px 20px}
  #rail>*{margin-left:0;margin-right:0}
  main{padding:20px 16px 80px;max-width:100%}
  body.focus main{padding:20px 16px 80px}
  .brand{font-size:22px}
  h1{font-size:28px}
  h2{font-size:22px;margin:18px 0 12px}
  .big{font-size:22px;line-height:1.35;margin:18px 0 22px}
  .big-q{font-size:19px;line-height:1.45;margin:12px 0 16px}
  .trh .lbl{display:none}
  .trh{justify-content:flex-end}
  #cols>summary{cursor:pointer;font-weight:700;padding:8px 0;font-size:15px}
  .nav{margin-top:12px}
  .navb{padding:10px 12px;font-size:15px}
  .cal{gap:4px;margin:8px 0}
  .day{min-height:36px}
  .btns button, button{min-height:42px;padding:9px 12px;font-size:14px}
  .choice{padding:12px;font-size:15px;min-height:46px}
  input[type=text],input[type=password],input[type=number],select,textarea{font-size:16px;padding:10px}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .katex-display{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:4px 0}
}
@media(max-width:480px){
  main{padding:16px 12px 80px}
  body.focus main{padding:16px 12px 80px}
  .btns button{flex:1 1 auto;text-align:center;justify-content:center}
  .day{min-height:34px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
<div id="rail">
<header id="top"></header>
<aside id="side" aria-label="Your classes"></aside>
<aside id="cal" aria-label="Study calendar"></aside>
</div>
<main id="main" tabindex="-1"><noscript>Leitner box needs JavaScript.</noscript></main>
</div>
<footer id="foot"></footer>
<div id="cookie" role="region" aria-label="Storage notice"></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg" aria-modal="true"></dialog>
<script>
'use strict';
window.onerror=function(msg,u,l){const m=document.getElementById('main');if(m&&!m.children.length){const p=document.createElement('p');p.textContent='A crash occurred: '+msg+' (line '+l+'). Your data is
